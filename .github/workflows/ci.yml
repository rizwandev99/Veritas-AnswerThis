name: Veritas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Style & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Linters
        run: |
          pip install ruff

      - name: Run Ruff (Backend Lint & Format Check)
        run: |
          cd apps/api
          ruff check app tests
          ruff format --check app tests

      - name: Install Node Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run ESLint (Frontend Lint Check)
        run: |
          cd apps/web
          npm run lint

  typecheck:
    name: Static Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies & Mypy
        run: |
          pip install mypy
          pip install -r apps/api/requirements.txt

      - name: Run Mypy (Backend Type Check)
        run: |
          cd apps/api
          mypy app

      - name: Install Node Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run TypeScript (Frontend Type Check)
        run: |
          cd apps/web
          npx tsc --noEmit

  test-api:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veritas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies & Test Tools
        run: |
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veritas_test
          VECTOR_STORE_BACKEND: pgvector
          OPENALEX_MAILTO: ci@veritas.local
          ENVIRONMENT: test
        run: |
          cd apps/api
          pytest tests -v

  test-web:
    name: Frontend Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run Vitest Suite
        run: |
          cd apps/web
          npm test

  build:
    name: Next.js & Docker Build Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-api, test-web]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Next.js Web Application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          cd apps/web
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: veritas-api:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: veritas-web:latest
